<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14233c"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing Background Orbs -->
  <circle cx="950" cy="240" r="180" fill="#10b981" opacity="0.07" filter="url(#glow-emerald)"/>
  <circle cx="820" cy="380" r="160" fill="#f59e0b" opacity="0.06" filter="url(#glow-amber)"/>

  <!-- Left Content Area -->
  <g transform="translate(90, 0)">
    <!-- Badge -->
    <g transform="translate(0, 160)">
      <rect width="215" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="107.5" y="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1.5">ELLMOS AI • AGENT HOOK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="260" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#title-grad)" letter-spacing="-1">WorkflowHooker</text>

    <!-- Tagline -->
    <text x="0" y="315" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Agent-Agnostic Behavior Hook &amp; Safety Gates for LLM CLIs</text>

    <!-- Subtitle / Short Description -->
    <text x="0" y="348" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748b">Closing gates, drift warnings &amp; scope guards for agent sessions</text>

    <!-- Feature Badges/Pills -->
    <g transform="translate(0, 415)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="19" r="4" fill="#34d399"/>
        <text x="35" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Closing Gates</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="19" r="4" fill="#fbbf24"/>
        <text x="35" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Drift &amp; Scope Guards</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(390, 0)">
        <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="19" r="4" fill="#38bdf8"/>
        <text x="35" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Zero Dependencies</text>
      </g>
    </g>
  </g>

  <!-- Right Graphic Motif: Workflow Pipeline, Safety Gates & Checkpoints -->
  <g transform="translate(730, 110)">
    <!-- Outer Decorative Orbit Circles -->
    <circle cx="220" cy="200" r="190" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 6"/>
    <circle cx="220" cy="200" r="140" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Workflow Pipeline Path / Nodes -->
    <path d="M 60 200 L 150 200 L 220 120 L 290 200 L 380 200" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 150 200 L 220 280 L 290 200" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Central Security Shield / Gate Checkpoint -->
    <g transform="translate(175, 140)">
      <!-- Shield Base -->
      <path d="M 45 10 C 45 10, 75 0, 90 10 C 90 40, 90 75, 45 110 C 0 75, 0 40, 0 10 C 15 0, 45 10, 45 10 Z" fill="#0f172a" stroke="#34d399" stroke-width="2.5" filter="url(#glow-emerald)"/>
      <path d="M 45 18 C 45 18, 68 10, 80 18 C 80 42, 80 68, 45 96 C 10 68, 10 42, 10 18 C 22 10, 45 18, 45 18 Z" fill="url(#accent-emerald)" opacity="0.15"/>
      
      <!-- Gate Lock Icon inside Shield -->
      <!-- Lock Shackle -->
      <path d="M 33 46 V 36 C 33 29.37 38.37 24 45 24 C 51.63 24 57 29.37 57 36 V 46" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
      <!-- Lock Body -->
      <rect x="29" y="46" width="32" height="24" rx="4" fill="#34d399"/>
      <!-- Keyhole -->
      <circle cx="45" cy="56" r="3" fill="#0f172a"/>
      <line x1="45" y1="56" x2="45" y2="63" stroke="#0f172a" stroke-width="2"/>
    </g>

    <!-- Pipeline Node Checkpoints -->
    <!-- Input Checkpoint Node (Left) -->
    <circle cx="60" cy="200" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="60" cy="200" r="5" fill="#38bdf8"/>
    <text x="60" y="232" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Hook Event</text>

    <!-- Gate Checkpoint 1 (Top) -->
    <circle cx="220" cy="120" r="14" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <path d="M 215 120 L 219 124 L 226 116" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="98" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Scope Guard</text>

    <!-- Gate Checkpoint 2 (Bottom) -->
    <circle cx="220" cy="280" r="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="220" cy="280" r="5" fill="#fbbf24"/>
    <text x="220" y="308" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Drift Check</text>

    <!-- Output Checkpoint Node (Right) -->
    <circle cx="380" cy="200" r="14" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <path d="M 375 200 L 379 204 L 386 196" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="380" y="232" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Closing Gate</text>

    <!-- Pulsing Connection Beams -->
    <circle cx="150" cy="200" r="4" fill="#34d399"/>
    <circle cx="290" cy="200" r="4" fill="#34d399"/>
  </g>
</svg>
