[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workflowhooker"
version = "0.2.2"
description = "Hooks zur Steuerung des Arbeitsablaufs: Zwischenchecks, Abschluss-Gates, Drift-Warnungen."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lukas Geiger", email = "support@lukasgeiger.com" }]
keywords = [
    "workflow",
    "agent-governance",
    "hooks",
    "claude-code",
    "codex",
    "kimi-code",
    "closing-gate",
    "loop-briefing",
    "drift-warning",
    "ellmos",
    "open-bricks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/workflowhooker-provenance"
Documentation = "https://github.com/ellmos-ai/workflowhooker-provenance#readme"
Repository = "https://github.com/ellmos-ai/workflowhooker-provenance.git"
"Bug Tracker" = "https://github.com/ellmos-ai/workflowhooker-provenance/issues"
Changelog = "https://github.com/ellmos-ai/workflowhooker-provenance/blob/master/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/workflowhooker-provenance/blob/master/SECURITY.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.scripts]
workflowhooker = "workflowhooker.cli:main"

[tool.setuptools.packages.find]
include = ["workflowhooker*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
